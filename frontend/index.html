<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RagDocAgent — Document workspace</title>
    <meta property="og:type" content="website" />
    <meta property="og:title" content="RagDocAgent — Document workspace" />
    <meta property="og:description" content="A focused workspace for searching and asking questions across your documents, with source citations." />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="RagDocAgent — Document workspace" />
    <meta name="twitter:description" content="Search and ask questions across your documents, with source citations." />
    <script>
      // Тема и язык ДО первой отрисовки — та же лестница, что в prefs.ts:
      // URL ?theme=/&lang= → localStorage → системная тема / английский.
      (function () {
        try {
          var q = new URLSearchParams(location.search)
          var t = q.get('theme') || localStorage.getItem('theme') || 'dark'
          if (t !== 'light' && t !== 'dark') t = 'dark'
          document.documentElement.dataset.theme = t
          var l = q.get('lang') || localStorage.getItem('lang')
          document.documentElement.lang = l === 'ru' ? 'ru' : 'en'
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
